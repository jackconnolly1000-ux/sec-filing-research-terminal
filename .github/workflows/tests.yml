# Runs the offline checks on every pull request and on pushes to main. No secrets are used and no SEC,
# Yahoo or Anthropic request is made: the saved reviews and committed fixtures are enough. Tests that
# re-read full saved filings (kept outside the repo, in data/raw/sec) skip because that folder isn't here.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"     # matches Streamlit Cloud (App settings)
          cache: pip

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      # One process, as the README documents; --durations lists the slowest tests if the run grows.
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" --durations 10

      - name: Release 1 saved-source audit
        run: python tests/offline/audit_release1.py

      - name: Offline app check
        run: python tests/offline/check_liquidity_app.py
